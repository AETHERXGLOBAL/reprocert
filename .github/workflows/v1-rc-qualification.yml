name: ReproCert v1 RC Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v1-rc-qualification.yml'
      - 'docs/V1_RC_QUALIFICATION_PROTOCOL.md'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-contact-package:
    name: RC zero-contact package path
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Build isolated RC distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'build>=1.2,<2'
          python -m build
          test -n "$(find dist -maxdepth 1 -name 'aetherx_reprocert-1.0.0rc1-*.whl' -print -quit)"
          test -f dist/aetherx_reprocert-1.0.0rc1.tar.gz

      - name: Install built wheel into clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv rc-env
          wheel="$(find dist -maxdepth 1 -name 'aetherx_reprocert-1.0.0rc1-*.whl' -print -quit)"
          rc-env/bin/python -m pip install --disable-pip-version-check "$wheel"
          test "$(rc-env/bin/reprocert --version)" = "reprocert 1.0.0rc1"

      - name: Zero-contact init -> doctor -> run -> verify -> inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir consumer
          cd consumer
          ../rc-env/bin/reprocert init command --github-actions
          grep -F 'apiVersion: reprocert.dev/v1' reprocert.yml
          grep -F 'AETHERXGLOBAL/reprocert@v1' .github/workflows/reprocert.yml
          if grep -F 'AETHERXGLOBAL/reprocert@v0.2' .github/workflows/reprocert.yml; then
            echo "stale Alpha channel generated by RC" >&2
            exit 1
          fi
          ../rc-env/bin/reprocert doctor
          ../rc-env/bin/reprocert run reprocert.yml -o certificate.json
          ../rc-env/bin/reprocert verify certificate.json --claim reprocert.yml --evidence-root .
          ../rc-env/bin/reprocert inspect certificate.json --json > inspect.json
          python - <<'PY'
          import json
          from pathlib import Path
          cert = json.loads(Path("certificate.json").read_text())
          assert cert["apiVersion"] == "reprocert.dev/certificate/v1"
          assert cert["metadata"]["tool_version"] == "1.0.0rc1"
          assert cert["verdict"] == "PASS"
          PY

  repeated-stability:
    name: RC repeated PASS / FAIL stability
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install candidate
        run: python -m pip install -e .

      - name: Create deterministic PASS and FAIL claims
        shell: bash
        run: |
          cat > pass.yml <<'YAML'
          apiVersion: reprocert.dev/v1
          kind: ReproducibilityClaim
          metadata: {id: rc-pass}
          spec:
            command: [python, -c, "print('stable-marker')"]
            checks:
              - id: marker
                source: {type: stdout}
                op: contains
                expected: stable-marker
          YAML
          cat > fail.yml <<'YAML'
          apiVersion: reprocert.dev/v1
          kind: ReproducibilityClaim
          metadata: {id: rc-fail}
          spec:
            command: [python, -c, "print('stable-marker')"]
            checks:
              - id: marker
                source: {type: stdout}
                op: contains
                expected: intentionally-absent
          YAML

      - name: Repeat deterministic PASS 100 times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repeated/pass
          for i in $(seq 1 100); do
            reprocert run pass.yml -o "repeated/pass/$i.json" >/dev/null
            reprocert verify "repeated/pass/$i.json" --claim pass.yml >/dev/null
            python - "$i" <<'PY'
          import json, sys
          from pathlib import Path
          cert = json.loads(Path(f"repeated/pass/{sys.argv[1]}.json").read_text())
          assert cert["verdict"] == "PASS"
          assert cert["apiVersion"] == "reprocert.dev/certificate/v1"
          PY
          done

      - name: Repeat deterministic FAIL 50 times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repeated/fail
          for i in $(seq 1 50); do
            set +e
            reprocert run fail.yml -o "repeated/fail/$i.json" >/dev/null
            rc=$?
            set -e
            test "$rc" -eq 1
            reprocert verify "repeated/fail/$i.json" --claim fail.yml >/dev/null
            python - "$i" <<'PY'
          import json, sys
          from pathlib import Path
          cert = json.loads(Path(f"repeated/fail/{sys.argv[1]}.json").read_text())
          assert cert["verdict"] == "FAIL"
          assert cert["apiVersion"] == "reprocert.dev/certificate/v1"
          PY
          done
