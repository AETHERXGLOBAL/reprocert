name: ReproCert v1 Stable Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'docs/V1_*.md'
      - 'docs/COMPATIBILITY.md'
      - 'pyproject.toml'
      - 'action.yml'
      - '.github/workflows/v1-stable-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-matrix:
    name: Source / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Install candidate
        run: python -m pip install -e ".[dev]"

      - name: Run complete test suite
        run: pytest

      - name: Verify candidate identity
        run: |
          python -c "import reprocert; assert reprocert.__version__ == '1.0.0', reprocert.__version__"
          reprocert --version

  legacy-forward-compatibility:
    name: Published Alpha -> v1 reader compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Generate an artifact with the exact published Alpha
        shell: bash
        run: |
          set -euo pipefail
          python -m venv alpha-env
          alpha-env/bin/python -m pip install --disable-pip-version-check --no-cache-dir "aetherx-reprocert==0.2.2a1"
          mkdir compat
          cat > compat/legacy-claim.yml <<'YAML'
          apiVersion: reprocert.dev/v1alpha1
          kind: ReproducibilityClaim
          metadata:
            id: published-alpha-compat
          spec:
            command: [python, -c, "from pathlib import Path; Path('evidence.txt').write_text('alpha-evidence', encoding='utf-8')"]
            evidence: [evidence.txt]
            checks:
              - id: evidence
                source: {type: text, path: evidence.txt}
                op: eq
                expected: alpha-evidence
          YAML
          alpha-env/bin/reprocert run compat/legacy-claim.yml -o compat/legacy-certificate.json
          alpha-env/bin/reprocert verify compat/legacy-certificate.json --claim compat/legacy-claim.yml --evidence-root compat
          python - <<'PY'
          import json
          from pathlib import Path
          cert = json.loads(Path("compat/legacy-certificate.json").read_text())
          assert cert["apiVersion"] == "reprocert.dev/certificate/v1alpha1"
          assert cert["metadata"]["tool_version"] == "0.2.2a1"
          PY
          sha256sum compat/legacy-claim.yml compat/legacy-certificate.json > compat/before.sha256

      - name: Install v1 candidate
        run: python -m pip install -e .

      - name: Prove v1 reads Alpha artifacts without rewriting them
        shell: bash
        run: |
          set -euo pipefail
          reprocert verify compat/legacy-certificate.json --claim compat/legacy-claim.yml --evidence-root compat
          reprocert inspect compat/legacy-certificate.json --json > compat/inspect.json
          sha256sum -c compat/before.sha256
          reprocert run compat/legacy-claim.yml -o compat/v1-from-legacy-claim.json
          python - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path("compat/legacy-certificate.json").read_text())
          new = json.loads(Path("compat/v1-from-legacy-claim.json").read_text())
          assert old["apiVersion"] == "reprocert.dev/certificate/v1alpha1"
          assert new["apiVersion"] == "reprocert.dev/certificate/v1"
          assert new["metadata"]["tool_version"] == "1.0.0"
          assert old["claim"]["sha256"] == new["claim"]["sha256"]
          assert new["verdict"] == "PASS"
          PY

  stable-self-service:
    name: Stable v1 self-service contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install candidate
        run: python -m pip install -e ".[dev]"

      - name: Zero-contact stable scaffold
        shell: bash
        run: |
          set -euo pipefail
          mkdir consumer
          cd consumer
          reprocert init command --github-actions
          grep -F 'apiVersion: reprocert.dev/v1' reprocert.yml
          grep -F 'AETHERXGLOBAL/reprocert@v1' .github/workflows/reprocert.yml
          if grep -F 'AETHERXGLOBAL/reprocert@v0.2' .github/workflows/reprocert.yml; then
            echo "stale Alpha channel in generated v1 workflow" >&2
            exit 1
          fi
          reprocert doctor
          reprocert run reprocert.yml -o certificate.json
          reprocert verify certificate.json --claim reprocert.yml --evidence-root .
          reprocert inspect certificate.json --json > inspect.json
          python - <<'PY'
          import json
          from pathlib import Path
          cert = json.loads(Path("certificate.json").read_text())
          assert cert["apiVersion"] == "reprocert.dev/certificate/v1"
          assert cert["metadata"]["tool_version"] == "1.0.0"
          assert cert["verdict"] == "PASS"
          PY

      - name: Stable policy and suite identities
        shell: bash
        run: |
          set -euo pipefail
          cd consumer
          cat > policy.yml <<'YAML'
          apiVersion: reprocert.dev/policy/v1
          kind: ReproCertPolicy
          metadata: {id: stable-policy}
          spec:
            allowed_verdicts: [PASS]
          YAML
          reprocert policy certificate.json policy.yml -o policy-result.json --json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("policy-result.json").read_text())
          assert result["apiVersion"] == "reprocert.dev/policy-result/v1"
          assert result["status"] == "PASS"
          PY

  package:
    name: Build v1 release-candidate distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Build isolated distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'build>=1.2,<2'
          python -m build
          test -n "$(find dist -maxdepth 1 -name 'aetherx_reprocert-1.0.0-*.whl' -print -quit)"
          test -f dist/aetherx_reprocert-1.0.0.tar.gz
