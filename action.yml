name: AETHER X ReproCert
description: Run a machine-readable claim and emit a claim-to-evidence certificate.
author: AETHER X GLOBAL
inputs:
  claim:
    description: Path to the ReproCert YAML or JSON claim file.
    required: true
  certificate:
    description: Output certificate path.
    required: false
    default: reprocert-certificate.json
  python-version:
    description: Python version used for the ReproCert runner.
    required: false
    default: '3.13'
outputs:
  verdict:
    description: PASS, FAIL, INCONCLUSIVE, or ERROR.
    value: ${{ steps.result.outputs.verdict }}
  certificate:
    description: Certificate file path.
    value: ${{ inputs.certificate }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install ReproCert
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Execute claim
      id: execute
      shell: bash
      run: |
        set +e
        reprocert run "${{ inputs.claim }}" --output "${{ inputs.certificate }}"
        rc=$?
        echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Export verdict
      id: result
      shell: python
      env:
        REPROCERT_CERTIFICATE: ${{ inputs.certificate }}
      run: |
        import json, os
        from pathlib import Path
        cert = json.loads(Path(os.environ["REPROCERT_CERTIFICATE"]).read_text(encoding="utf-8"))
        verdict = cert["verdict"]
        print(f"ReproCert verdict: {verdict}")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"verdict={verdict}\n")
    - name: Enforce claim verdict
      shell: python
      env:
        REPROCERT_CERTIFICATE: ${{ inputs.certificate }}
      run: |
        import json, os, sys
        from pathlib import Path
        verdict = json.loads(Path(os.environ["REPROCERT_CERTIFICATE"]).read_text(encoding="utf-8"))["verdict"]
        sys.exit(0 if verdict == "PASS" else 1)
branding:
  icon: check-circle
  color: blue
